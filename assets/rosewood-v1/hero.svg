<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Hritika Adhikary — rosewood research and engineering; decorative DNA animation">
<title>Hritika Adhikary — rosewood research and engineering; decorative DNA animation</title><defs><linearGradient id="paper" x2="1" y2=".6"><stop stop-color="#1D1618"/><stop offset=".52" stop-color="#251B20"/><stop offset="1" stop-color="#3A232C"/></linearGradient><radialGradient id="bloom"><stop stop-color="#5B2E38" stop-opacity=".8"/><stop offset="1" stop-color="#1D1618" stop-opacity="0"/></radialGradient><linearGradient id="petal" x2="1" y2="1"><stop stop-color="#E5C7BD"/><stop offset="1" stop-color="#8F5C6B"/></linearGradient><style>
@keyframes scan {0%,100%{transform:translateY(-45px);opacity:.15}50%{transform:translateY(45px);opacity:.9}}
@keyframes compression {0%,100%{transform:scaleY(1)}50%{transform:scaleY(.72)}}
@keyframes load {0%,100%{transform:translateY(0)}50%{transform:translateY(18px)}}
@keyframes contour {0%,15%{stroke-dashoffset:420;opacity:.35}70%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes signal {to{stroke-dashoffset:-180}}
@keyframes firing {0%,65%,100%{opacity:.25}20%,35%{opacity:1}}
@keyframes packet {0%{stroke-dashoffset:220}100%{stroke-dashoffset:0}}
@keyframes helix {0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.scan {animation:scan 5.8s ease-in-out infinite}
.tissue {transform-box:fill-box;transform-origin:center bottom;animation:compression 6.4s ease-in-out infinite}
.plate {animation:load 6.4s ease-in-out infinite}
.contour {stroke-dasharray:420;animation:contour 7.8s ease-in-out infinite}
.signal {stroke-dasharray:24 156;animation:signal 4s linear infinite}
.node {animation:firing 7.2s ease-in-out infinite}
.packet {stroke-dasharray:14 206;animation:packet 5.3s linear infinite}
.helix {transform-box:fill-box;transform-origin:center;animation:helix 14s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.scan,.tissue,.plate,.contour,.signal,.node,.packet,.helix{animation:none!important;transform:none!important}.contour{stroke-dashoffset:0}.signal,.packet{stroke-dasharray:none}.node{opacity:1}}
</style></defs>
